name: ESLint Check

# Trigger the workflow on every push to any branch
on: [push]

jobs:
    lint:
        name: Run ESLint
        runs-on: ubuntu-latest

        steps:
            # Step 1: Check out the repository code
            - name: Checkout Code
              uses: actions/checkout@v4

            # Step 2: Set up the Node.js environment
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Specify your project's Node version
                  cache: "npm" # Caches dependencies for faster subsequent runs

            # Step 3: Install project dependencies safely
            - name: Install Dependencies
              run: npm ci

            # Step 4: Run the ESLint script
            - name: Run Linter
              run: npm run lint
